<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F8F5">
<title>Ritmo · treino e dieta</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239BDCC6'/%3E%3Cstop offset='1' stop-color='%233B9C85'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='11' y='21' width='7' height='22' rx='3.5' fill='%23fff'/%3E%3Crect x='46' y='21' width='7' height='22' rx='3.5' fill='%23fff'/%3E%3Crect x='19' y='25' width='5' height='14' rx='2.5' fill='%23fff' opacity='.8'/%3E%3Crect x='40' y='25' width='5' height='14' rx='2.5' fill='%23fff' opacity='.8'/%3E%3Crect x='24' y='30' width='16' height='4' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#F6F8F5;--s:#fff;--ink:#1E2B28;--mu:#7C8985;--ln:#E6EBE7;--ac:#3B9C85;--ac2:#DDF3EC}
body[data-v=d]{--ac:#D9814F;--ac2:#FCEBDF}
body[data-v=c]{--ac:#6D80D8;--ac2:#E6EAFB}
body[data-v=p]{--ac:#4A94C7;--ac2:#E0F0FA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#app,.top{max-width:560px;margin:auto;padding:14px 16px}
.top{display:flex;align-items:center;gap:10px;padding-top:calc(14px + env(safe-area-inset-top))}
.top svg{width:34px;height:34px;border-radius:10px;flex:none}.top b{font-size:19px;letter-spacing:.2px;flex:1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h2,h3{margin:0}h2{font-size:26px}small{color:var(--mu);display:block}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 12px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(40,70,60,.04)}
.btn,.ghost{padding:11px 16px;border-radius:14px;font-weight:600;background:var(--ac2);color:var(--ac)}
.btn.pri{background:var(--ac);color:#fff}.ghost{background:var(--s);border:1px solid var(--ln);color:var(--ink);font-weight:500}
.big{width:100%;margin:10px 0;padding:14px}
.row,.row3{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.row>*{flex:1}.row3{margin:0 0 6px}.row3>*{flex:1;padding:10px 4px;font-size:13px}
.rowb{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:var(--ac2);color:var(--ac);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.ib{width:34px;height:34px;border-radius:10px;background:var(--bg);margin-left:4px}
.strip{display:flex;justify-content:space-between;padding:10px}
.dy{text-align:center;width:13%}.dy i{display:grid;place-items:center;width:34px;height:34px;margin:4px auto 0;border-radius:50%;font-style:normal;font-size:13px;color:var(--mu);background:var(--bg)}
.dy.dn i{background:var(--ac);color:#fff}.dy.sk i{background:#F2E9E4;color:#B08A78}.dy.td i{box-shadow:0 0 0 2px var(--ac)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.clk{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac)}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.set{min-width:46px;height:46px;padding:0 8px;border-radius:50%;border:2px solid var(--ln);font-weight:700;background:var(--s)}
.set.on{background:var(--ac);border-color:var(--ac);color:#fff}.set.hold{border-color:var(--ac);animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 6px var(--ac2)}}
.ok{border-color:var(--ac)}
.hp{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--ac2);border-radius:14px;padding:10px}.hp span{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac)}.hp .btn{margin-left:auto}
.chip{padding:7px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);font-size:13px;flex:0 0 auto}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--ln)}.it small{text-align:right}.mh{margin-top:10px;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.6px;color:var(--ac)}
.g6{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g6 .card{margin:0}.g6 b{font-size:30px;color:var(--ac);display:block}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px}.chart div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.chart i{display:block;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.85}
.seg{display:flex;background:var(--ln);border-radius:14px;padding:3px}.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;color:var(--mu)}.seg .on{background:var(--s);color:var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.dial{position:relative;width:250px;height:250px;margin:18px auto}.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}.dial div{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:6px 12px;border-radius:14px}.nav svg{width:22px;height:22px}.nav .on{color:var(--ac);background:var(--ac2);font-weight:700}
#rb{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:536px;margin:auto;background:var(--ink);color:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:6}
#rb svg{width:52px;height:52px;transform:rotate(-90deg)}#rb b{font-size:26px;font-variant-numeric:tabular-nums}#rb small{color:#aebbb6}#rb button{margin-left:auto;background:#ffffff22;border-radius:12px;padding:8px 12px}
.sh{position:fixed;inset:0;background:rgba(30,43,40,.35);display:none;align-items:flex-end;z-index:9}.sh.open{display:flex}
.sh>div{background:var(--s);width:100%;max-width:560px;margin:auto;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
label{display:block;margin:12px 0 4px;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f2 label{margin-top:8px}
.ex{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--ln)}.ex div{flex:1}
.dr{display:grid;grid-template-columns:1fr 1.4fr 1fr .8fr 30px;gap:5px;margin:6px 0}.dr input{padding:9px 7px;font-size:13px}
.em{text-align:center;color:var(--mu);padding:26px 10px}.em svg{width:64px;height:64px;color:var(--ac);opacity:.5}
</style></head><body>
<div class="top"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9BDCC6"/><stop offset="1" stop-color="#3B9C85"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><rect x="11" y="21" width="7" height="22" rx="3.5" fill="#fff"/><rect x="46" y="21" width="7" height="22" rx="3.5" fill="#fff"/><rect x="19" y="25" width="5" height="14" rx="2.5" fill="#fff" opacity=".8"/><rect x="40" y="25" width="5" height="14" rx="2.5" fill="#fff" opacity=".8"/><rect x="24" y="30" width="16" height="4" rx="2" fill="#fff"/></svg><b>Ritmo</b><button class="ib" data-a="cfg" aria-label="Ajustes">⚙</button></div>
<div id="app"></div><div id="rb" hidden></div>
<nav class="nav" id="nav"></nav><div class="sh" id="sh"><div id="shc"></div></div>
<input type="file" id="imp" accept="application/json" hidden>
<script>
const $=s=>document.querySelector(s),K='ritmo.v1',DS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
let S=Object.assign({w:[],d:[],h:[],p:[],pa:null,sv:0,sd:[],a:null,snd:1,c:{m:'up',on:0,b:0,t:0,d:60,l:[],f:0}},JSON.parse(localStorage.getItem(K)||'{}')),V=localStorage.getItem('ritmo.v')||'w',D={},AC;
const save=()=>localStorage.setItem(K,JSON.stringify(S)),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const q=(s,t)=>{const e=$(s);if(e&&e.textContent!==t)e.textContent=t};
const cnt=e=>e.dn.filter(Boolean).length,todayIdx=()=>(new Date().getDay()+6)%7;
const spec=e=>e.t=='i'?`${e.s}× ${e.r}s isometria`:`${e.s}${e.r?'×'+esc(e.r):' séries'}${e.l?' · '+esc(e.l)+' kg':''}${e.rest?' · desc. '+e.rest+'s':''}`;
const ico=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const NV=[['w','Treino','<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'],['d','Dieta','<path d="M12 6c-3-2-7 0-7 5 0 5 4 9 7 9s7-4 7-9c0-5-4-7-7-5zM12 6c0-2 1-3 3-3"/>'],['c','Cronômetro','<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>'],['p','Progresso','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>']];
const EMPTY=t=>`<div class="em">${ico('<circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/>')}<p>${t}</p></div>`;
function beep(n=1){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.15;o.start(AC.currentTime+i*.25);o.stop(AC.currentTime+i*.25+.15)}}catch(e){}navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:200)}
document.addEventListener('click',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
async function wake(){try{if(S.a)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>document.visibilityState=='visible'&&wake());

/* ---------- views ---------- */
function R(){document.body.dataset.v=V;$('#app').innerHTML={w:vW,d:vD,c:vC,p:vP}[V]();
 $('#nav').innerHTML=NV.map(n=>`<button class="${n[0]==V?'on':''}" data-a="nv" data-i="${n[0]}">${ico(n[2])}${n[1]}</button>`).join('');
 const r=S.a&&S.a.rest,rb=$('#rb');rb.hidden=!r;
 if(r)rb.innerHTML=`<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="#ffffff30" stroke-width="5"/><circle id="rbr" cx="30" cy="30" r="26" fill="none" stroke="#9BDCC6" stroke-width="5" stroke-linecap="round" stroke-dasharray="163.4"/></svg><div><small>Descanso</small><b id="rbt">00:00</b></div><button data-a="r15">+15s</button><button data-a="rx">Pular</button>`;
 tick()}
function vW(){if(S.a)return vS();const pr=S.p.find(p=>p.id==S.pa);if(!pr)return vT();const t=todayIdx(),mon=new Date();mon.setDate(mon.getDate()-t);
 const strip=DS.map((d,i)=>{const dt=new Date(mon);dt.setDate(mon.getDate()+i);const hs=S.h.filter(h=>h.date==ymd(dt)),dn=hs.some(h=>h.k!='skip'),sk=!dn&&hs.some(h=>h.k=='skip');return `<div class="dy ${dn?'dn':''} ${sk?'sk':''} ${i==t?'td':''}"><small>${d}</small><i>${dn?'✓':sk?'–':dt.getDate()}</i></div>`}).join('');
 const ws=S.w.map((w,i)=>({w,i})).filter(x=>x.w.p==pr.id).sort((a,b)=>b.w.days.includes(t)-a.w.days.includes(t));
 return `<div class="hd"><div><small>${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</small><h2>${esc(pr.n)}</h2>${pr.sub?`<small>${esc(pr.sub)}</small>`:''}</div><div style="display:flex;gap:6px;align-items:center"><button class="ib" data-a="te" data-i="${pr.id}" aria-label="Editar treino">✎</button><button class="ghost" data-a="tb" style="padding:9px 12px">Trocar</button></div></div><div class="card strip">${strip}</div>
 <div class="row3"><button class="ghost" data-a="alt">Alternativo</button><button class="ghost" data-a="skip">Pular hoje</button><button class="ghost" data-a="ext">+ Extra</button></div>`+
 (ws.length?ws.map(({w,i})=>`<div class="card"><div class="rowb"><div><b>${esc(w.n)}</b><small>${w.days.length?w.days.map(d=>DS[d]).join(' · '):'sem dia fixo'} · ${w.ex.length} exerc.</small></div>${w.days.includes(t)?'<span class="pill">Hoje</span>':''}</div>
 <small style="margin-top:6px">${w.ex.slice(0,3).map(e=>esc(e.n)).join(', ')}${w.ex.length>3?'…':''}</small>
 <div class="row"><button class="btn pri" data-a="go" data-i="${i}">Iniciar</button><button class="ghost" data-a="we" data-i="${i}">Editar</button><button class="ghost" data-a="wx" data-i="${i}">Excluir</button></div></div>`).join(''):EMPTY('Este treino ainda não tem fichas.'))+`<button class="btn pri big" data-a="nw">+ Nova ficha</button>`}
function vT(){
 return `<div class="hd"><div><small>Escolha qual treino seguir</small><h2>Treinos</h2></div></div>`+
 (S.p.length?S.p.map(p=>{const fs=S.w.filter(w=>w.p==p.id),dys=[...new Set(fs.flatMap(w=>w.days))].sort((a,b)=>a-b);
  return `<div class="card"><div><b>${esc(p.n)}</b>${p.sub?`<small>${esc(p.sub)}</small>`:''}<small>${fs.length} ficha${fs.length==1?'':'s'}${dys.length?' · '+dys.map(d=>DS[d]).join(' · '):''}</small></div>
  <div class="row"><button class="btn pri" data-a="tk" data-i="${p.id}">Abrir</button><button class="ghost" data-a="te" data-i="${p.id}">Editar</button><button class="ghost" data-a="tx" data-i="${p.id}">Excluir</button></div></div>`}).join(''):EMPTY('Crie seu primeiro treino.'))+`<button class="btn pri big" data-a="tn">+ Novo treino</button>`}
function vS(){const a=S.a,tot=a.ex.reduce((n,e)=>n+e.s,0),dn=a.ex.reduce((n,e)=>n+cnt(e),0);
 return `<div class="hd"><div><small>${a.k=='alt'?'Treino alternativo':'Em andamento'+(a.pn?' · '+esc(a.pn):'')}</small><h2>${esc(a.name)}</h2></div><div class="clk" id="clk">00:00</div></div><div class="bar"><i style="width:${tot?dn/tot*100:0}%"></i></div><small>${dn} de ${tot} séries</small>`+
 a.ex.map((e,i)=>`<div class="card ${cnt(e)>=e.s?'ok':''}"><div class="rowb"><div>${e.m?`<small>${esc(e.m)}</small>`:''}<b>${esc(e.n)}</b><small>${spec(e)}</small></div><div><button class="ib" data-a="ct" data-i="${i}" title="Abrir no cronômetro">⏱</button><button class="ib" data-a="sr" data-i="${i}">×</button></div></div>
 <div class="sets">${Array.from({length:e.s},(_,j)=>{const d=e.dn[j],h=a.hold&&a.hold.i==i&&a.hold.j==j;return `<button class="set ${d?'on':''} ${h?'hold':''}" data-a="set" data-i="${i}" data-j="${j}">${d?(e.t=='i'?d+'s':'✓'):(e.t=='i'?e.r+'s':j+1)}</button>`}).join('')}</div>
 ${a.hold&&a.hold.i==i?`<div class="hp"><span id="ht">00:00</span><small>meta ${e.r}s</small><button class="btn pri" data-a="hd">Finalizar</button></div>`:''}</div>`).join('')+
 `<button class="ghost big" data-a="add">+ Adicionar aparelho/exercício só hoje</button><button class="btn pri big" data-a="end">Encerrar treino</button>`}
function vD(){return `<div class="hd"><div><small>Plano alimentar</small><h2>Dieta</h2></div></div>`+(S.d.length?S.d.map((d,i)=>{const kc=d.it.reduce((s,x)=>s+(+x.c||0),0),g={};d.it.forEach(x=>(g[x.m||'']=g[x.m||'']||[]).push(x));
 return `<div class="card"><div class="rowb"><b>${esc(d.n)}</b>${kc?`<span class="pill">${kc} kcal</span>`:''}</div>${Object.entries(g).map(([m,xs])=>`${m?`<small class="mh">${esc(m)}</small>`:''}${xs.map(x=>`<div class="it"><span>${esc(x.f)}</span><small>${[x.q,x.c?x.c+' kcal':''].filter(Boolean).map(esc).join(' · ')}</small></div>`).join('')}`).join('')}<div class="row"><button class="ghost" data-a="de" data-i="${i}">Editar</button><button class="ghost" data-a="dx" data-i="${i}">Excluir</button></div></div>`}).join(''):EMPTY('Cadastre sua primeira dieta.'))+`<button class="btn pri big" data-a="dn">+ Nova dieta</button>`}
function vC(){const c=S.c,presets=[30,45,60,90,120,300];
 return `<div class="hd"><div><small>Para isometria, descansos e mais</small><h2>Cronômetro</h2></div></div><div class="seg"><button class="${c.m=='up'?'on':''}" data-a="cm" data-i="up">Crescente</button><button class="${c.m=='down'?'on':''}" data-a="cm" data-i="down">Decrescente</button></div>
 <div class="dial"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--ln)" stroke-width="5"/><circle id="cr" cx="50" cy="50" r="45" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0"/></svg><div id="cd">00:00</div></div>
 <div class="row"><button class="ghost" data-a="cz">Zerar</button><button class="btn pri" data-a="cg" id="cgb">Iniciar</button>${c.m=='up'?'<button class="ghost" data-a="cl">Volta</button>':''}</div>
 ${c.m=='down'?`<div class="card"><div class="f2"><div><label>Min</label><input type="number" min="0" id="cmn" value="${Math.floor(c.d/60)}" data-a="cs"></div><div><label>Seg</label><input type="number" min="0" max="59" id="csc" value="${c.d%60}" data-a="cs"></div></div><div class="row" style="flex-wrap:wrap">${presets.map(p=>`<button class="chip ${c.d==p?'on':''}" data-a="cp" data-i="${p}">${p>=60&&p%60==0?p/60+' min':p+'s'}</button>`).join('')}</div></div>`:''}
 ${c.m=='up'&&c.l.length?`<div class="card">${c.l.map((l,i)=>`<div class="it"><span>Volta ${c.l.length-i}</span><b>${fmt(l/1000)}.${Math.floor(l/100)%10}</b></div>`).join('')}</div>`:''}`}
const rng=k=>{const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),o=todayIdx();
 return {d:[new Date(y,m,d),new Date(y,m,d+1)],w:[new Date(y,m,d-o),new Date(y,m,d-o+7)],m:[new Date(y,m,1),new Date(y,m+1,1)],t:[new Date(y,m-m%3,1),new Date(y,m-m%3+3,1)],s:[new Date(y,m<6?0:6,1),new Date(y,m<6?6:12,1)],a:[new Date(y,0,1),new Date(y+1,0,1)]}[k]};
const inR=(h,r)=>{const d=new Date(h.date+'T00:00:00');return d>=r[0]&&d<r[1]};
